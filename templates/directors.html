{% extends "base.html" %}
{% block title %}Режисьори{% endblock %}

{% block content %}
<h1>Directors</h1>

<form method="get">
  <input name="q" placeholder="Search director" value="{{ q or '' }}">
  <button type="submit">Търси</button>
</form>

<ul class="list">
  {% for d in directors %}
    <li>
      <a href="{{ url_for('director_detail', director_id=d.id) }}"><b>{{ d.name }}</b></a>
    </li>
  {% else %}
    <li>No directors found.</li>
  {% endfor %}
</ul>
{% endblock %}
