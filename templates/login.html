{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<h1>Login</h1>

<form method="post">
  <div>
    <label>Username:</label>
    <input type="text" name="username" required>
  </div>

  <div>
    <label>Password:</label>
    <input type="password" name="password" required>
  </div>

  <button type="submit">Login</button>
</form>
{% endblock %}
