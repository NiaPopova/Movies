{% extends "base.html" %}
{% block title %}{{ director.name }}{% endblock %}

{% block content %}
<h1>{{ director.name }}</h1>

<h2>Movies</h2>
<ul class="list">
  {% for m in movies %}
    <li>
      <a href="{{ url_for('movie_detail', movie_id=m.id) }}"><b>{{ m.title }}</b></a>
      {% if m.year %}<span class="badge">{{ m.year }}</span>{% endif %}
    </li>
  {% else %}
    <li>No directors yet.</li>
  {% endfor %}
</ul>
{% endblock %}
